<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>eKarolBagh – App Mockup</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{--blue:#1456d9;--blue2:#0b3fa8;--tint:#eaf1ff;--bg:#f3f7ff;--card:#fff;--text:#0f1b33;--mute:#60708f;--line:#dbe5fa;--ok:#1456d9;--warn:#5b6b8c;--page:#e6eeff;box-sizing:border-box}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Inter',system-ui,sans-serif;background:var(--bg);color:var(--text);height:100vh;height:100dvh;overflow:hidden;-webkit-font-smoothing:antialiased}
#app{display:flex;flex-direction:column;height:100vh;height:100dvh;max-width:100%}
.stage{display:flex;gap:24px;justify-content:center;align-items:center;height:100%}
.jump{width:170px;display:flex;flex-direction:column;gap:6px}
.jump b{font-size:11px;color:var(--mute);text-transform:uppercase;letter-spacing:.06em;margin-bottom:2px}
.jump button{font-family:inherit;text-align:left;font-size:13px;font-weight:600;padding:9px 12px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--text);cursor:pointer}
.phone{width:375px;max-width:100%;height:min(780px,100%);background:var(--bg);border-radius:34px;border:8px solid #0b1224;overflow:hidden;display:flex;flex-direction:column;box-shadow:0 20px 50px rgba(10,30,80,.25)}
.status{background:var(--blue);color:#fff;font-size:12px;font-weight:600;display:flex;justify-content:space-between;padding:8px 20px 2px}
.top{background:var(--blue);color:#fff;padding:6px 14px 12px}
.row{display:flex;align-items:center;gap:10px}
.logo{background:#fff;border-radius:10px;padding:4px 8px;display:flex;align-items:center}.logo img{height:34px;display:block}
.wl{position:absolute;right:5px;top:5px;width:26px;height:26px;border-radius:50%;background:#fff;display:grid;place-items:center;font-size:14px;cursor:pointer;box-shadow:0 1px 4px rgba(10,30,80,.15);line-height:1}
.img .wl{top:auto;bottom:5px}
.hero .wl{bottom:auto;width:38px;height:38px;font-size:20px;right:14px;top:14px}
.mini .em{position:relative}
.ico{width:34px;height:34px;border-radius:50%;background:rgba(255,255,255,.16);display:grid;place-items:center;font-size:16px;cursor:pointer;position:relative;flex:none}
.back{font-size:20px;cursor:pointer;width:24px}
.ttl{font-weight:700;font-size:16px;flex:1}
.search{margin-top:10px;background:#fff;color:#6b7690;border-radius:10px;padding:11px 14px;font-size:13px;cursor:pointer}
.scroll{flex:1;overflow-y:auto}
.sec{background:var(--card);margin-top:8px;padding:14px}
.sec h3{font-size:15px;font-weight:700;margin-bottom:10px;display:flex;justify-content:space-between}
.sec h3 a{font-size:12px;color:var(--blue);font-weight:600;cursor:pointer}
.banner{margin:10px 12px 0;border-radius:14px;background:linear-gradient(120deg,var(--blue2),var(--blue) 60%,#3b82f6);color:#fff;padding:18px;display:flex;justify-content:space-between;align-items:center;min-height:120px}
.banner h2{font-size:20px;font-weight:800;line-height:1.15}.banner p{font-size:12px;opacity:.9;margin-top:6px}.banner .big{font-size:56px}
.btn-sm{display:inline-block;margin-top:10px;background:#fff;color:var(--blue);font-weight:700;font-size:12px;padding:7px 14px;border-radius:20px;cursor:pointer}
.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:12px 4px}
.cat{text-align:center;font-size:10.5px;font-weight:500;line-height:1.2;cursor:pointer}
.cat i{display:grid;place-items:center;width:52px;height:52px;margin:0 auto 5px;border-radius:14px;background:var(--tint);font-style:normal;font-size:24px}
.hs{display:flex;gap:10px;overflow-x:auto}
.mini{min-width:130px;border:1px solid var(--line);border-radius:12px;padding:10px;font-size:12px;cursor:pointer}
.mini .em{font-size:34px;text-align:center;background:var(--tint);border-radius:8px;padding:10px 0;margin-bottom:6px}
.mini b{display:block;font-size:14px;margin-top:2px}.mini s{color:var(--mute);font-size:11px;font-weight:400}
.nav{display:flex;background:var(--card);border-top:1px solid var(--line);padding:8px 0}
.nav div{flex:1;text-align:center;font-size:10px;color:var(--mute);font-weight:500;cursor:pointer}
.nav div span{display:block;font-size:19px}.nav .on{color:var(--blue);font-weight:700}
.dot{position:absolute;top:-3px;right:-3px;background:#0b3fa8;border:2px solid #fff;color:#fff;font-size:9px;font-weight:700;border-radius:9px;padding:1px 5px}
.chips{display:flex;gap:8px;overflow-x:auto;padding:10px 12px;background:var(--card);border-bottom:1px solid var(--line)}
.chip{white-space:nowrap;font-size:12px;font-weight:600;padding:6px 12px;border-radius:20px;border:1px solid var(--line);background:var(--card);cursor:pointer}
.chip.on{background:var(--blue);color:#fff;border-color:var(--blue)}
.gtog{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:10px 12px;background:var(--card)}
.gtog button{font-family:inherit;border:1.5px solid var(--blue);background:var(--card);color:var(--blue);font-weight:700;font-size:13px;padding:10px 6px;border-radius:10px;cursor:pointer}
.gtog button.on{background:var(--blue);color:#fff}
.count{font-size:12px;color:var(--mute);padding:8px 14px 0}
.list{padding:8px 12px;display:grid;gap:8px}
.p{background:var(--card);border-radius:12px;padding:10px;display:flex;gap:10px;border:1px solid var(--line);cursor:pointer}
.img{width:86px;height:86px;border-radius:10px;background:var(--tint);display:grid;place-items:center;font-size:40px;flex:none;position:relative}
.tag{position:absolute;left:0;top:6px;font-size:9px;font-weight:700;color:#fff;padding:2px 6px;border-radius:0 6px 6px 0;background:var(--ok)}
.tag.n{background:var(--warn)}
.p h4{font-size:13px;font-weight:600;line-height:1.3}
.pr{font-size:17px;font-weight:800;margin-top:4px}.pr small{font-size:11px;font-weight:500;color:var(--mute)}
.moq,.sm{font-size:11px;color:var(--mute);margin-top:2px}
.foot{display:flex;justify-content:space-between;align-items:center;margin-top:6px}
.badge{font-size:10.5px;font-weight:600;color:var(--ok)}.badge.n{color:var(--warn)}
.btn{background:var(--blue);color:#fff;border:0;font-family:inherit;font-weight:700;font-size:13px;padding:12px;border-radius:10px;cursor:pointer;flex:1}
.btn.o{background:var(--card);color:var(--blue);border:1.5px solid var(--blue)}
.btn.s{padding:7px 16px;font-size:12px;flex:none;border-radius:8px}
.bar{display:flex;gap:10px;padding:10px 12px;background:var(--card);border-top:1px solid var(--line)}
.hero{height:210px;background:var(--tint);display:grid;place-items:center;font-size:110px;position:relative}
.hero .tag{font-size:11px;padding:4px 10px;top:14px}
.off{color:var(--ok);font-weight:700;font-size:13px}
.step{display:inline-flex;align-items:center;border:1.5px solid var(--blue);border-radius:8px;overflow:hidden}
.step span{padding:5px 11px;font-weight:700;color:var(--blue);cursor:pointer;font-size:15px}
.step em{font-style:normal;padding:5px 10px;font-weight:700;font-size:13px;min-width:34px;text-align:center;background:var(--tint)}
table{width:100%;border-collapse:collapse;font-size:12px}td,th{padding:8px;border-bottom:1px solid var(--line);text-align:left}th{color:var(--mute);font-weight:600}
.kv{display:flex;justify-content:space-between;font-size:13px;padding:5px 0}.kv.t{font-weight:800;font-size:15px;border-top:1px dashed var(--line);margin-top:6px;padding-top:10px}
.opt{display:flex;gap:10px;align-items:center;padding:11px;border:1.5px solid var(--line);border-radius:10px;margin-bottom:8px;font-size:13px;font-weight:600;cursor:pointer}
.opt.on{border-color:var(--blue);background:var(--tint)}.opt small{display:block;font-weight:400;color:var(--mute);font-size:11px}
.rad{width:16px;height:16px;border-radius:50%;border:2px solid var(--mute);flex:none}.on .rad{border:5px solid var(--blue)}
.ok{width:84px;height:84px;border-radius:50%;background:var(--ok);color:#fff;display:grid;place-items:center;font-size:44px;margin:26px auto 12px}
.tl{border-left:2px solid var(--line);margin-left:8px;padding-left:16px}.tl div{position:relative;font-size:13px;padding-bottom:16px}.tl div:before{content:"";position:absolute;left:-23px;top:3px;width:12px;height:12px;border-radius:50%;background:var(--line)}.tl .d:before{background:var(--ok)}.tl small{display:block;color:var(--mute);font-size:11px}
.st{font-size:11px;font-weight:700;padding:3px 8px;border-radius:12px;background:var(--tint);color:var(--blue)}.st.g{background:var(--blue);color:#fff}
.menu{display:flex;justify-content:space-between;padding:13px 0;border-bottom:1px solid var(--line);font-size:14px;font-weight:500;cursor:pointer}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.stats div{background:var(--tint);border-radius:10px;padding:10px;text-align:center;font-size:11px;color:var(--mute)}.stats b{display:block;font-size:16px;color:var(--blue)}
.logo,.ttl,.sec h3,.banner h2,h2,h3,h4,.pr,.stats b,.jump b{font-family:'Poppins','Inter',sans-serif}
.logo{font-weight:700;letter-spacing:0}.sec h3,.ttl,.p h4,h2{font-weight:600}.banner h2{font-weight:700}.p h4{font-size:12.5px;line-height:1.35}.pr{font-weight:600}

.img{overflow:hidden}.img img,.hero img,.mini .em img{max-width:100%;max-height:100%;object-fit:contain;display:block}.hero img{max-height:190px}
.mini{width:140px;min-width:140px;flex:none}.mini .em{height:78px;display:grid;place-items:center;padding:6px}
.mini .mn{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;line-height:1.3;min-height:31px}
.mini .mw{display:block;font-size:10.5px;color:var(--mute);margin-top:2px}
.p h4{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.p .off{font-size:11px}
.ghead{text-align:center;padding:22px 16px 6px}.gbig{font-size:42px;width:82px;height:82px;border-radius:22px;background:var(--card);border:1px solid var(--line);display:grid;place-items:center;margin:0 auto 10px}.ghead h2{font-size:20px}.ghead p{font-size:13px;color:var(--mute);margin-top:2px}
.gcard{display:flex;gap:12px;align-items:center;background:var(--card);border:1.5px solid var(--blue);border-radius:14px;padding:16px 14px;cursor:pointer}
.gcard.alt{border-color:var(--line)}.gcard.dis{opacity:.55;cursor:not-allowed;border-style:dashed;background:transparent}
.gcard .gi{width:48px;height:48px;border-radius:12px;background:var(--tint);display:grid;place-items:center;font-size:24px;flex:none}
.gcard b{display:block;font-size:15px;font-family:'Poppins','Inter',sans-serif;font-weight:600}.gcard span{display:block;font-size:12px;margin-top:2px}.gcard small{display:block;font-size:11px;color:var(--mute);margin-top:2px}
.chev{color:var(--blue);font-size:24px}
.gtog button:disabled{opacity:.4;cursor:not-allowed}
.bgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:8px 12px 12px}
.brand{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 10px;cursor:pointer;text-align:center;min-width:0}
.bl{width:50px;height:50px;border-radius:50%;background:var(--tint);color:var(--blue);font-weight:700;display:grid;place-items:center;margin:0 auto 8px;font-family:'Poppins','Inter',sans-serif;font-size:16px}
.bl.all{background:var(--blue);color:#fff;font-size:12px}
.bl.lg{width:100%;max-width:120px;height:56px;border-radius:10px;background:#fff;border:1px solid var(--line);padding:5px;overflow:hidden}.bl.lg{display:flex;align-items:center;justify-content:center}.bl.lg img{max-width:100%;max-height:100%;width:auto;height:auto;object-fit:contain;display:block}
.brand b{display:block;font-size:13px;font-family:'Poppins','Inter',sans-serif;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.brand span{font-size:11px;color:var(--mute)}
.src{font-size:11px;color:var(--mute);margin-top:10px;line-height:1.45}
.rv{padding:10px 0;border-bottom:1px solid var(--line)}.rv:last-child{border:0;padding-bottom:0}.rvh{display:flex;align-items:center;gap:8px;font-size:12.5px;flex-wrap:wrap}.rvs{color:var(--blue);letter-spacing:1px}.rvs i{font-style:normal;color:var(--line)}.rvv{font-size:10.5px;color:var(--mute)}.rv p{font-size:12.5px;line-height:1.5;margin-top:4px}.rv small{font-size:10.5px;color:var(--mute)}

/* product images: white tiles, whole photo visible */
.img{display:flex;align-items:center;justify-content:center;background:#fff;border:1px solid var(--line);padding:4px}
.img img,.mini .em img{width:100%;height:100%;max-width:none;max-height:none;object-fit:contain;display:block}
.mini .em{display:flex;align-items:center;justify-content:center;background:#fff;border:1px solid var(--line);height:110px;padding:6px;position:relative}
.mini{min-width:150px;width:150px}
.is-oos .img img,.is-oos .em img,.hero.is-oos img{opacity:.4}
.oos{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);background:#e11d2e;color:#fff;font-weight:700;font-size:11px;padding:5px 11px;border-radius:20px;white-space:nowrap;box-shadow:0 2px 8px rgba(225,29,46,.35);z-index:1;pointer-events:none}
.mini .oos{font-size:10.5px}
.hero .oos{font-size:18px;padding:10px 24px}
.oost{color:#e11d2e}
.oosbig{margin-top:8px;color:#e11d2e;font-weight:700;font-size:15px}
.btn:disabled{background:#c9d3e6;border-color:#c9d3e6;color:#fff;cursor:not-allowed}
.hero{display:block;height:320px;background:#fff;padding:0;border-bottom:1px solid var(--line)}
.hero .emo{display:flex;align-items:center;justify-content:center;height:100%;font-size:110px}
.gal{display:flex;height:100%;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none}
.gal::-webkit-scrollbar{display:none}
.gal img{flex:0 0 100%;width:100%;height:100%;object-fit:contain;padding:14px;scroll-snap-align:center;max-height:none}
.gdots{position:absolute;bottom:10px;left:0;right:0;display:flex;justify-content:center;gap:5px}
.gdots i{width:6px;height:6px;border-radius:3px;background:#c9d3e6;transition:width .2s}
.gdots i.on{width:16px;background:var(--blue)}
.gthumbs{display:flex;gap:8px;padding:10px 14px;background:var(--card);overflow-x:auto;border-bottom:1px solid var(--line)}
.gthumbs img{width:58px;height:58px;flex:none;object-fit:contain;background:#fff;border:1.5px solid var(--line);border-radius:8px;padding:3px;cursor:pointer}
.gthumbs img.on{border-color:var(--blue)}
.rich{font-size:13px;line-height:1.6;color:var(--text);overflow-wrap:anywhere}
.rich p{margin:0 0 8px}.rich ul,.rich ol{padding-left:20px;margin:0 0 8px}.rich li{margin:4px 0}
.rich strong,.rich b{font-weight:700}.rich h1,.rich h2,.rich h3,.rich h4,.rich h5{font-size:14px;margin:12px 0 6px;font-weight:700}
.rich table{margin:6px 0}.rich img{max-width:100%;height:auto;border-radius:8px;margin:6px 0}.rich>*:last-child{margin-bottom:0}
.vlab{font-size:12px;font-weight:600;color:var(--mute);margin:12px 0 6px}.vopts{display:flex;gap:8px;flex-wrap:wrap}.vopts .vx{opacity:.45;text-decoration:line-through}
.sinput{flex:1;min-width:0;border:0;border-radius:10px;padding:11px 14px;font:inherit;font-size:14px;outline:none;background:#fff;color:var(--text)}

.minbar{background:#fff7e6;border-top:1px solid #fde3a7;padding:10px 14px;font-size:12.5px;color:#7a4b00}
.minbar small{display:block;color:#a06a10;font-size:11px;margin-top:1px}
.minbar i{display:block;height:6px;border-radius:3px;background:#fde3a7;margin-top:8px;overflow:hidden}.minbar s{display:block;height:100%;background:#f59e0b;border-radius:3px}
.fl{display:block;font-size:12px;font-weight:600;color:var(--mute);margin-bottom:12px}
.fw{display:flex;align-items:center;margin-top:5px;border:1.5px solid var(--line);border-radius:10px;background:#fff}
.fw:focus-within{border-color:var(--blue)}
.fw input{flex:1;min-width:0;border:0;outline:none;background:transparent;font:inherit;font-size:14px;font-weight:500;color:var(--text);padding:11px 12px}
.fw em{font-style:normal;padding:0 12px;cursor:pointer;font-size:15px}
.fgt,.lnk{color:var(--blue);font-weight:600;cursor:pointer}.fgt{display:block;text-align:right;font-size:12px;margin:-4px 0 10px}
.ferr{color:#e11d2e;font-size:12px;min-height:16px;margin-bottom:4px}

/* icon set */
.ic{width:1em;height:1em;display:inline-block;vertical-align:-.15em;object-fit:contain;pointer-events:none}
.wh{filter:brightness(0) invert(1)}
.back .ic{width:20px;height:20px;vertical-align:middle}
.ico .ic{width:18px;height:18px}
.search .ic{width:16px;height:16px;vertical-align:-3px;margin-right:8px;opacity:.6}
.banner .big .ic{width:72px;height:72px;opacity:.95}
.cat i .ic{width:30px;height:30px}
.nav div span{display:flex;justify-content:center;margin-bottom:3px}.nav .ic{width:22px;height:22px}
.nav div:not(.on) .ic{filter:grayscale(1);opacity:.55}
.wl .ic{width:15px;height:15px}.hero .wl .ic{width:20px;height:20px}
.gi .ic{width:28px;height:28px}.gbig .ic{width:46px;height:46px}
.in{width:14px;height:14px;margin-right:6px;vertical-align:-2px}
.gtog button.on .ic{filter:brightness(0) invert(1)}
.gtog button:disabled .ic{filter:grayscale(1)}
.mi{display:flex;align-items:center;gap:12px}.mi .ic{width:22px;height:22px}
.fw em .ic{width:18px;height:18px;vertical-align:middle;opacity:.7}
.rvv .in{width:12px;height:12px;margin-right:3px}
.okw{width:96px;margin:26px auto 12px}.okw .ic{width:96px;height:96px}
.emo .ic{width:1em;height:1em}
.img .emo{font-size:40px}

/* wishlist button: small white circle, never stretched or faded by the photo rules */
.wl{width:30px;height:30px;right:6px;top:6px;border-radius:50%;background:#fff;box-shadow:0 1px 5px rgba(10,30,80,.18);display:flex;align-items:center;justify-content:center;z-index:2}
.img .wl,.mini .em .wl{bottom:auto;top:6px;right:6px}
.img .wl img,.mini .em .wl img,.hero .wl img,.wl img{width:16px!important;height:16px!important;max-width:none;opacity:1!important;filter:none;padding:0;border:0;background:none}
.hero .wl{width:40px;height:40px;right:14px;top:14px}.hero .wl img{width:22px!important;height:22px!important}
.img{position:relative}.img .wl{width:26px;height:26px}.img .wl img{width:14px!important;height:14px!important}
.hs{scrollbar-width:none;padding-bottom:2px}.hs::-webkit-scrollbar{display:none}
/* home: four big category buttons */
.cbig{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.cb{display:flex;align-items:center;gap:12px;background:var(--tint);border-radius:14px;padding:14px 12px;cursor:pointer;min-width:0;border:1px solid transparent}
.cb:active{border-color:var(--blue)}
.cb i{flex:none;width:52px;height:52px;border-radius:12px;background:#fff;display:flex;align-items:center;justify-content:center}
.cb i .ic{width:34px;height:34px}
.cb b{display:block;font-family:'Poppins','Inter',sans-serif;font-weight:600;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cb span{display:block;font-size:11px;color:var(--mute);margin-top:1px}
.cb>b,.cb>span{grid-column:2}
.cb{display:grid;grid-template-columns:52px 1fr;grid-template-rows:auto auto;column-gap:12px;align-items:center}
.cb i{grid-row:1/3}
.mini .rm{display:block;color:var(--blue);font-weight:600;font-size:12px;margin-top:4px}
/* hide every scrollbar inside the phone, like a real mobile app */
#app *{scrollbar-width:none;-ms-overflow-style:none}#app *::-webkit-scrollbar{display:none;width:0;height:0}
.fl{min-width:0}.fw textarea{flex:1;min-width:0;border:0;outline:none;background:transparent;font:inherit;font-size:14px;font-weight:500;color:var(--text);padding:11px 12px;resize:none;line-height:1.45}
/* phone (768px and below) is the base layout; notch / gesture-bar safe areas */
.top{padding-top:calc(10px + env(safe-area-inset-top))}.nav,.bar{padding-bottom:calc(8px + env(safe-area-inset-bottom))}
/* tablet & desktop (769px and up): full width bars, content centred, more columns */
@media (min-width:769px){
 .top,.chips,.gtog,.count,.bar,.minbar{padding-left:max(14px,calc(50% - 560px));padding-right:max(14px,calc(50% - 560px))}
 .nav{padding-left:calc(50% - 320px);padding-right:calc(50% - 320px)}
 .scroll{padding:0 max(16px,calc(50% - 560px)) 16px}
 .scroll>.sec,.scroll>.list>.p,.scroll>.banner{border-radius:14px}.scroll>.sec{margin-top:12px}
 .list{grid-template-columns:repeat(2,1fr);gap:12px;padding:12px 0}
 .bgrid{grid-template-columns:repeat(4,1fr);gap:12px;padding:12px 0}

walk(c);if(!OKT[t]){var f=d.createDocumentFragment();while(c.firstChild)f.appendChild(c.firstChild);c.replaceWith(f);return}

function sresults(){var t=S.sq.trim().toLowerCase().split(/\s+/).filter(Boolean);if(!t.length&&!S.scat)return empty("search","Search across "+P.length+" products by name, brand or category");
var r=P.filter(function(p){if(S.scat&&p.cat!==S.scat)return false;if(!t.length)return true;var h=p._h||(p._h=[p.name,p.brand,CN[p.cat],p.categoryPath||"",(p.tags||[]).join(" "),p.sku||""].join(" ").toLowerCase());return t.every(function(w){return h.indexOf(w)>-1})});

function ferr(m,id,ok){var e=document.getElementById(id||"ferr");if(e){e.style.color=ok?"var(--blue)":"";e.textContent=m}}

async function placeOrder(){var a={name:val("an"),phone:val("ap").replace(/\D/g,"").slice(-10),line:val("a1"),landmark:val("al"),pin:val("apc"),city:val("ac"),state:val("as")};
if(!a.name)return ferr("Please enter the receiver's name");if(!/^[6-9]\d{9}$/.test(a.phone))return ferr("Please enter a valid 10-digit mobile number");if(a.line.length<8)return ferr("Please enter the full address");if(!/^\d{6}$/.test(a.pin))return ferr("Please enter a valid 6-digit pincode");if(!a.city||!a.state)return ferr("Please enter city and state");
var b=document.getElementById("pob");b.disabled=true;try{var o=await EKB.placeOrder(a,"app");S.on=o.number;H=["home"];S.s="done";H.last=null;draw()}catch(x){ferr(x.message);b.disabled=false;var sc=document.querySelector(".scroll");if(sc)sc.scrollTop=0}}

async function delAccount(){var pw=prompt("This permanently deletes your account. Enter your password to confirm:");if(!pw)return;try{await EKB.deleteMe(pw);H=[];S.s="home";draw()}catch(x){alert(x.message)}}
async function cancelOrder(n){if(!confirm("Cancel order "+n+"?"))return;try{await EKB.cancelOrder(n);draw()}catch(x){alert(x.message)}}
async function delAddr(id){if(!confirm("Delete this address?"))return;await EKB.deleteAddress(id).catch(function(x){alert(x.message)});draw()}
async function defAddr(id){var a=(await EKB.addresses()).filter(function(x){return x.id===id})[0];if(a)await EKB.updateAddress(id,Object.assign({},a,{isDefault:true})).catch(function(x){alert(x.message)});draw()}

function openB(i){S.brand=i<0?null:S.bl[i];go("list")}

function qty(d){var m=moq(prd(S.pid));S.q=Math.max(m,S.q+d*m);draw()}
function cq(k,d){var c=ck(k);if(!c)return;var m=moq(c.p);EKB.setQty(k,Math.max(m,S.cart[k]+d*m))}
